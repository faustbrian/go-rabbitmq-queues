name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean
      full_assurance:
        description: Run the unchanged broker, PHP, performance and cluster campaigns
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@e192eb43fa434081af318a40b0f20caf57094701 # qualified public v2.1.3 source
    with:
      tooling_sha: e192eb43fa434081af318a40b0f20caf57094701
      source_bootstrap: false
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}

  integration-scope:
    name: Select owned broker assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      focused: ${{ steps.scope.outputs.focused }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_ASSURANCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.full_assurance || inputs.release_dry_run) }}
        run: |
          set -euo pipefail
          case "${FULL_ASSURANCE}" in true|false) ;; *) exit 1 ;; esac
          case "${EVENT_NAME}" in pull_request|push|schedule|workflow_dispatch) ;; *) exit 1 ;; esac
          focused=true
          if [[ "${FULL_ASSURANCE}" == false && "${EVENT_NAME}" == schedule ]]; then
            focused=false
          elif [[ "${FULL_ASSURANCE}" == false &&
                  ( "${EVENT_NAME}" == pull_request || "${EVENT_NAME}" == push ) ]]; then
            [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git cat-file -e "${BASE_SHA}^{commit}" || exit 1
            changed_paths="$(git diff --no-ext-diff --no-renames --name-only "${BASE_SHA}" HEAD)" || exit 1
            focused=false
            while IFS= read -r path; do
              [[ -n "${path}" ]] || continue
              case "${path}" in
                README.md|CONTRIBUTING.md|AGENTS.md|CODE_OF_CONDUCT.md|SUPPORT.md|SECURITY.md|LICENSE|CHANGELOG.md) ;;
                *) focused=true; break ;;
              esac
            done <<< "${changed_paths}"
          fi
          printf 'focused=%s\nfull=%s\n' "${focused}" "${FULL_ASSURANCE}" >> "${GITHUB_OUTPUT}"

  live-broker:
    name: RabbitMQ 4.3 TLS
    needs: integration-scope
    if: needs.integration-scope.outputs.focused == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - run: ./scripts/ci-live-broker.sh single

  php-interop:
    name: PHP 8.5 interoperability
    needs: integration-scope
    if: needs.integration-scope.outputs.focused == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5.11
          extensions: mbstring, openssl, sockets
          tools: composer:2.10.1
          coverage: none
      - run: ./scripts/ci-live-broker.sh php

  performance:
    name: Performance ${{ matrix.queue_type }} ${{ matrix.daily_messages }}/day
    needs: integration-scope
    if: needs.integration-scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        queue_type: [classic, quorum]
        daily_messages: [1000000, 10000000, 100000000]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - run: ./scripts/ci-live-broker.sh performance
        env:
          QUEUE_TYPE: ${{ matrix.queue_type }}
          DAILY_MESSAGES: ${{ matrix.daily_messages }}

  cluster:
    name: Three-node ${{ matrix.scenario }}
    needs: integration-scope
    if: needs.integration-scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - classic-node-loss
          - quorum-leader-loss
          - quorum-network-partition
          - cluster-restart
          - reconnect-storm
          - rolling-upgrade
          - application-rolling-deployment
          - prolonged-outage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - run: ./scripts/ci-live-cluster.sh "${FAULT_SCENARIO}"
        env:
          FAULT_SCENARIO: ${{ matrix.scenario }}

  cluster-performance:
    name: Three-node performance leader-loss ${{ matrix.daily_messages }}/day
    needs: integration-scope
    if: needs.integration-scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        daily_messages: [1000000, 10000000, 100000000]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - run: ./scripts/ci-live-cluster.sh quorum-performance-leader-loss
        env:
          DAILY_MESSAGES: ${{ matrix.daily_messages }}

  required:
    name: Required
    if: always()
    needs: [ci, integration-scope, live-broker, php-interop, performance, cluster, cluster-performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every result
        env:
          SCOPE_RESULT: ${{ needs.integration-scope.result }}
          FOCUSED: ${{ needs.integration-scope.outputs.focused }}
          FULL: ${{ needs.integration-scope.outputs.full }}
          CI_RESULT: ${{ needs.ci.result }}
          LIVE_BROKER_RESULT: ${{ needs.live-broker.result }}
          PHP_INTEROP_RESULT: ${{ needs.php-interop.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          CLUSTER_RESULT: ${{ needs.cluster.result }}
          CLUSTER_PERFORMANCE_RESULT: ${{ needs.cluster-performance.result }}
        run: |
          set -euo pipefail
          test "${CI_RESULT}" = success
          test "${SCOPE_RESULT}" = success
          case "${FOCUSED}" in true) focused_result=success ;; false) focused_result=skipped ;; *) exit 1 ;; esac
          case "${FULL}" in true) full_result=success ;; false) full_result=skipped ;; *) exit 1 ;; esac
          if [[ "${FULL}" == true ]]; then
            test "${FOCUSED}" = true
          fi
          for result in "${LIVE_BROKER_RESULT}" "${PHP_INTEROP_RESULT}"; do
            test "${result}" = "${focused_result}"
          done
          for result in \
            "${PERFORMANCE_RESULT}" \
            "${CLUSTER_RESULT}" \
            "${CLUSTER_PERFORMANCE_RESULT}"; do
            test "${result}" = "${full_result}"
          done
