schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: [.]
        run: '^Test(PublishTrackerCorrelatesConcurrentCompletions|ProducerShutdownCallersHaveIndependentDeadlines)$'
        race: true
        count: 1
        timeout: 2m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPublicationValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzDeliveryConversion$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPublishTrackerCorrelation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzTopologyValidation$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: operator
        timeout: 20m
  - module: .
    gate: interoperability
    steps:
      - type: go-test
        packages: [.]
        run: '^TestLanguageNeutralInteroperabilityFixturePreservesAMQPMetadataAndBytes$'
        count: 1
        timeout: 20m
