schema_version: 1
tool_version: v1.0.14
tool_checksums_sha256: 88341d2f2904925b22ec8de084fec68c5229669f1119f066ed5fccd76aee2f82

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPublicationValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzDeliveryConversion$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPublishTrackerCorrelation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzTopologyValidation$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: operator
        timeout: 20m
  - module: .
    gate: interoperability
    steps:
      - type: go-test
        packages: [.]
        run: '^TestLanguageNeutralInteroperabilityFixturePreservesAMQPMetadataAndBytes$'
        count: 1
        timeout: 20m
