schema_version: 1
tool_version: v1.2.0
tool_checksums_sha256: 7de6de3a14184eced8c0114bf802cb24a808f3e1592d358f6f6f3d02552d0e27

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPublicationValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzDeliveryConversion$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPublishTrackerCorrelation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzTopologyValidation$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: operator
        timeout: 20m
  - module: .
    gate: interoperability
    steps:
      - type: go-test
        packages: [.]
        run: '^TestLanguageNeutralInteroperabilityFixturePreservesAMQPMetadataAndBytes$'
        count: 1
        timeout: 20m
